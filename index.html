
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch làm việc</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>
    <div class="container">
        <h2>Lịch làm việc</h2>

        <div class="form">
            <div>
                <label for="employee">Tên nhân viên</label>
                <select id="employee">
                    <option>Đoàn Văn Đức</option>
                    <option>Lê Xuân Hiển</option>
                    <option>Phạm Quang Hưng</option>
                    <option>Nguyễn Văn Tiến</option>
                    <option>Hà Xuân Diện</option>
                    <option>Hoàng Duy Tuấn</option>
                </select>
            </div>

            <div>
                <label for="shift">Kíp</label>
                <input type="text" id="shift" readonly>
            </div>

            <div>
                <label for="month">Tháng</label>
                <select id="month"></select>
            </div>

            <div>
                <label for="year">Năm</label>
                <select id="year">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
        </div>

        <button type="button" id="generateBtn">
            Tạo lịch & Tính công
        </button>

        <!-- Lịch âm dương -->
        <h2 class="calendar-title">LỊCH DƯƠNG</h2>
        <div id="calendar" class="calendar"></div>

        <!-- footer -->
        <div class="summary">
            <div class="card">
                <h3>Ngày làm</h3>
                <p id="workDays">0</p>
            </div>

            <div class="card">
                <h3>Ngày nghỉ</h3>
                <p id="offDays">0</p>
            </div>

            <div class="card">
                <h3>Giờ hành chính</h3>
                <p id="normalHours">0</p>
            </div>

            <div class="card">
                <h3>Tăng ca</h3>
                <p id="otHours">0</p>
            </div>

            <div class="card">
                <h3>Tổng giờ</h3>
                <p id="totalHours">0</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
